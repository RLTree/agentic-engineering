[package]
name = "dj-registry"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Deterministic evidence retrieval and advisory style-fingerprint control plane for Design Judgment Authorial 12"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true
